repos:
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: v0.12.8
        hooks:
            -   id: ruff
                args: [ --fix ]

            -   id: ruff-format

    -   repo: local
        hooks:
            -   id: ruff-format-per-file
                name: ruff format per-file (panic-safe)
                entry: python scripts/format_all.py
                language: system
                types: [python]
                pass_filenames: false

    -   repo: https://github.com/pre-commit/mirrors-mypy
        rev: v1.17.1
        hooks:
            -   id: mypy
